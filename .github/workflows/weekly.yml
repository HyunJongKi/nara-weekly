name: weekly-nara

on:
  schedule:
    # 매주 수요일 10:00 KST = 01:00 UTC (수=3)
    - cron: "0 1 * * 3"
    # 매주 금요일 10:00 KST = 01:00 UTC (금=5)
    - cron: "0 1 * * 5"
  workflow_dispatch: {}  # 수동 실행 가능

permissions:
  contents: write  # commit & push 권한

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: 수집 + 키워드 매칭
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          LOOKBACK_DAYS: "7"
          LOOKAHEAD_DAYS: "90"
          RESEARCH_ONLY: "1"   # 학술연구용역만 통과
        run: python scripts/collect.py

      - name: 대시보드 HTML 생성
        run: python scripts/render.py

      - name: 카톡 발송 (나에게 보내기)
        id: kakao
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python scripts/kakao.py

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name "nara-weekly-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tenders.json docs/tenders.json docs/index.html docs/keywords.yml
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "weekly update $(date -u +%Y-%m-%d)"
            git push
          fi
