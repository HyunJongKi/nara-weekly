# 회사 관심 키워드. 가중치(weight)가 높을수록 카톡 메시지에서 위로 노출됨.
# 합산 점수가 min_score 이상인 건만 카톡으로 발송된다 (대시보드에는 전부 노출).
# 학술연구용역 필터는 collect.py 의 research_only_filter 가 별도로 처리한다.
min_score: 5

keywords:
  - { term: "농업",         weight: 5, group: "agriculture" }
  - { term: "농촌",         weight: 5, group: "rural space" }
  - { term: "식량",         weight: 5, group: "agriculture" }
  - { term: "원예",         weight: 5, group: "agriculture" }
  - { term: "스마트팜",     weight: 6, group: "smartfarm" }
  - { term: "노지 스마트",  weight: 6, group: "smartfarm" }
  - { term: "노지스마트",   weight: 6, group: "smartfarm" }
  - { term: "산림",         weight: 5, group: "forestry" }
  - { term: "임업",         weight: 5, group: "forestry" }
  - { term: "친환경농업",   weight: 5, group: "agriculture" }
  - { term: "유기농산업",   weight: 5, group: "agriculture" }
